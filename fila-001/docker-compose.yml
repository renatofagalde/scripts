# Vive em: itau-um3-app-wshandler/local/docker-compose.yml
# Os repos irmãos estão dois níveis acima (../../ a partir de local/).
name: um-local

services:
  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: "sqs,s3,ssm"       # ajuste ao que os apps realmente usam
      DEBUG: "0"
    volumes:
      - "./localstack/init:/etc/localstack/init/ready.d"
    healthcheck:
      test: ["CMD", "awslocal", "sqs", "list-queues"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    command: valkey-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Apps de pano de fundo (sobem no `up` default) ------------------------

  pushnotification:
    build:
      context: ../../itau-um3-app-pushnotification
      dockerfile: Dockerfile
      args:
        CMD_PATH: ./app            # confirme onde está o main.go
        GOPRIVATE_GLOB: github.com/SEU-ORG/*
      secrets: [gh_token]
    depends_on:
      localstack: { condition: service_healthy }
      valkey:     { condition: service_healthy }
    environment:
      AWS_ENDPOINT_URL: "http://localstack:4566"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
      AWS_REGION: "us-east-1"
      VALKEY_ADDR: "valkey:6379"

  # Descomente se precisar do authorizer no fluxo:
  # authorizer:
  #   build:
  #     context: ../../itau-um3-app-iumessenger-lambda-authorizer-websocket
  #     dockerfile: Dockerfile
  #     args: { CMD_PATH: ./app, GOPRIVATE_GLOB: github.com/SEU-ORG/* }
  #     secrets: [gh_token]
  #   depends_on:
  #     localstack: { condition: service_healthy }
  #     valkey:     { condition: service_healthy }
  #   environment:
  #     AWS_ENDPOINT_URL: "http://localstack:4566"
  #     AWS_REGION: "us-east-1"
  #     AWS_ACCESS_KEY_ID: "test"
  #     AWS_SECRET_ACCESS_KEY: "test"
  #     VALKEY_ADDR: "valkey:6379"

  # --- wshandler: só sobe com --profile full (default = você debuga no GoLand)

  wshandler:
    profiles: ["full"]
    build:
      context: ..                  # a raiz do próprio repo wshandler
      dockerfile: Dockerfile
      args:
        CMD_PATH: ./app
        GOPRIVATE_GLOB: github.com/SEU-ORG/*
      secrets: [gh_token]
    depends_on:
      localstack:       { condition: service_healthy }
      valkey:           { condition: service_healthy }
      pushnotification: { condition: service_started }
    environment:
      AWS_ENDPOINT_URL: "http://localstack:4566"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
      AWS_REGION: "us-east-1"
      VALKEY_ADDR: "valkey:6379"

secrets:
  gh_token:
    file: ./gh_token.txt
