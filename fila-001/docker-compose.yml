# itau-um3-app-wshandler/local/docker-compose.yml
# Módulo Go de cada repo está em <repo>/app/ (go.mod lá) -> context aponta p/ app/.
name: um-local

# ---- blocos reaproveitados (edite GOPRIVATE aqui, 1 lugar só) --------------
x-go-args: &go_args
  GOPRIVATE_GLOB: github.com/SEU-ORG/*     # pegue do `module` em qualquer app/go.mod

x-aws-env: &aws_env
  AWS_ENDPOINT_URL: "http://localstack:4566"
  AWS_ACCESS_KEY_ID: "test"
  AWS_SECRET_ACCESS_KEY: "test"
  AWS_REGION: "us-east-1"
  VALKEY_ADDR: "valkey:6379"

x-infra-ready: &infra_ready
  localstack: { condition: service_healthy }
  valkey:     { condition: service_healthy }

services:
  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: "sqs,s3,ssm"
      DEBUG: "0"
    volumes:
      - "./localstack/init:/etc/localstack/init/ready.d"
    healthcheck:
      test: ["CMD", "awslocal", "sqs", "list-queues"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    command: valkey-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  historic:
    build:
      context: ../../itau-um3-app-historic/app
      dockerfile: Dockerfile
      args:
        <<: *go_args
        CMD_PATH: ./cmd/app          # confirme: find app/cmd -name main.go
      secrets: [gh_token]
    depends_on: *infra_ready
    environment: *aws_env

  authorizer:
    build:
      context: ../../itau-um3-app-iumessenger-lambda-authorizer-websocket/app
      dockerfile: Dockerfile
      args:
        <<: *go_args
        CMD_PATH: ./cmd/app
      secrets: [gh_token]
    depends_on: *infra_ready
    environment: *aws_env

  pushnotification:
    build:
      context: ../../itau-um3-app-pushnotification/app
      dockerfile: Dockerfile
      args:
        <<: *go_args
        CMD_PATH: ./cmd/app
      secrets: [gh_token]
    depends_on: *infra_ready
    environment: *aws_env

  # wshandler: só sobe com --profile full (default = você debuga no GoLand)
  wshandler:
    profiles: ["full"]
    build:
      context: ../app
      dockerfile: Dockerfile
      args:
        <<: *go_args
        CMD_PATH: ./cmd/app
      secrets: [gh_token]
    depends_on:
      <<: *infra_ready
      pushnotification: { condition: service_started }
    environment: *aws_env

secrets:
  gh_token:
    file: ./gh_token.txt
